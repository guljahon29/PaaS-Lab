
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangi talaba qo‘shish</title>
</head>
<body>
    <h1>Yangi talaba qo‘shish</h1>

    <form method="POST">
        <label>F.I.Sh.:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Guruh:</label>
        <input type="text" name="group" required>
        <br><br>

        <label>Fan:</label>
        <input type="text" name="subject" required>
        <br><br>

        <label>Ball:</label>
        <input type="number" name="score" min="0" max="100" required>
        <br><br>

        <button type="submit">Saqlash</button>
    </form>

    <a href="/">Bosh sahifaga qaytish</a>
</body>
</html>
